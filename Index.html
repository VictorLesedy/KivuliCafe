<style>
:root{
  --ink:#2a1d15; --ink-2:#5b4a3e; --sand:#f5eee3; --sand-2:#ece2d3; --card:#fffaf3;
  --terra:#a84f2a; --leaf:#3e5a3b; --line:#dccfbd;
  --r:14px; --max:1120px;
  --fs-h1:clamp(2.4rem,6vw,4.4rem); --fs-h2:clamp(1.7rem,3.6vw,2.6rem);
  --body:"Bricolage Grotesque",system-ui,sans-serif; --head:Fraunces,Georgia,serif;
}
html[lang="zh"]{--body:"Bricolage Grotesque","PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;--head:Fraunces,"Songti SC","Noto Serif SC",serif}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--body);background:var(--sand);color:var(--ink);line-height:1.6;font-size:16px}
h1,h2,h3{font-family:var(--head);font-weight:600;line-height:1.12;letter-spacing:-.01em}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--terra);outline-offset:3px;border-radius:6px}
.wrap{max-width:var(--max);margin:0 auto;padding:0 24px}
.eyebrow{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--terra);font-weight:600}
.muted{color:var(--ink-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 22px;border-radius:999px;border:1px solid var(--ink);background:var(--ink);color:var(--sand);font-weight:500;cursor:pointer;text-decoration:none;transition:background .2s,color .2s,border-color .2s}
.btn:hover{background:var(--terra);border-color:var(--terra)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--ink);color:var(--sand)}
.btn.sm{min-height:38px;padding:0 16px;font-size:.9rem}
.btn[disabled]{opacity:.4;pointer-events:none}
.hidden{display:none!important}

/* header */
header{position:sticky;top:0;z-index:20;background:rgba(245,238,227,.94);backdrop-filter:blur(8px);border-bottom:1px solid transparent;transition:border-color .2s}
header.scrolled{border-color:var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:68px;gap:16px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:Fraunces,serif;font-weight:600;font-size:1.25rem;letter-spacing:.08em;white-space:nowrap}
.brand svg{width:30px;height:30px}
.brand small{font-weight:400;letter-spacing:.18em;font-size:.8em;color:var(--terra)}
.nav ul{display:flex;gap:22px;list-style:none}
.nav ul a{text-decoration:none;font-size:.93rem;color:var(--ink-2)}
.nav ul a:hover{color:var(--ink)}
.nav-r{display:flex;align-items:center;gap:8px}
.lang{min-height:38px;border:1px solid var(--line);border-radius:999px;background:transparent;padding:0 10px;font-size:.85rem;cursor:pointer}
.badge{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--terra);color:#fff;font-size:.72rem;display:grid;place-items:center;padding:0 5px}
.badge[data-n="0"]{display:none}
.rel{position:relative}
@media (max-width:1320px){.nav ul{display:none}}
.nav ul a,.btn{white-space:nowrap}
@media (max-width:520px){.brand small{display:none}.track-lbl,.cart-lbl{display:none}.nav-r .btn.sm{padding:0 12px}.lang{padding:0 6px}}
.bag{width:16px;height:16px;display:none}
@media (max-width:520px){.bag{display:block}}

/* hero */
.hero{padding:72px 0 88px}
.hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:56px;align-items:center}
.hero h1{font-size:var(--fs-h1);margin:14px 0 20px}
.hero h1 em{font-style:italic;color:var(--terra);font-weight:400}
.hero p.lead{font-size:1.12rem;max-width:36ch;color:var(--ink-2);margin-bottom:30px}
.hero-ctas{display:flex;gap:12px;flex-wrap:wrap}
.hero-art{aspect-ratio:4/5;border-radius:220px 220px var(--r) var(--r);background:var(--leaf);position:relative;overflow:hidden}
.hero-art svg{position:absolute;inset:0;width:100%;height:100%}
.hero-meta{display:flex;gap:32px;margin-top:40px;font-size:.9rem;color:var(--ink-2);flex-wrap:wrap}
.hero-meta strong{display:block;font-family:var(--head);font-size:1.3rem;color:var(--ink)}
@media (max-width:860px){.hero-grid{grid-template-columns:1fr}.hero-art{max-width:360px;aspect-ratio:1/1;border-radius:var(--r)}}

section{padding:88px 0}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:36px;flex-wrap:wrap}
.sec-head h2{font-size:var(--fs-h2);margin-top:8px}
.sec-head p{max-width:42ch}

/* menu */
#menu{background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px}
.tab{min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:.92rem}
.tab[aria-selected="true"]{background:var(--ink);color:var(--sand);border-color:var(--ink)}
.usual{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;border:1px solid var(--line);background:var(--sand);border-radius:var(--r);padding:16px 20px;margin-bottom:24px}
.usual b{font-family:var(--head);font-size:1.1rem}
.usual span{color:var(--ink-2);font-size:.92rem}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{background:var(--card);padding:22px;display:flex;flex-direction:column;gap:8px;min-height:170px;cursor:pointer;transition:background .2s}
.item:hover{background:#fff}
.item-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.item h3{font-size:1.15rem}
.price{font-weight:600;white-space:nowrap;font-size:.95rem}
.item p{font-size:.92rem;color:var(--ink-2);flex:1}
.item-foot{display:flex;justify-content:space-between;align-items:center}
.tag{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--leaf);font-weight:600}
.add{width:40px;height:40px;border-radius:50%;border:1px solid var(--ink);background:transparent;cursor:pointer;font-size:1.2rem;display:grid;place-items:center;transition:background .2s,color .2s}
.add:hover{background:var(--ink);color:var(--sand)}
.add.added{background:var(--leaf);border-color:var(--leaf);color:#fff}
.hint{font-size:.85rem;color:var(--ink-2);margin-top:14px}

/* steps */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;counter-reset:s}
.step{padding:28px;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
.step::before{counter-increment:s;content:"0" counter(s);font-family:Fraunces,serif;color:var(--terra);font-size:1.1rem}
.step h3{font-size:1.2rem;margin:10px 0 6px}
.step p{font-size:.94rem;color:var(--ink-2)}
@media (max-width:760px){.steps{grid-template-columns:1fr}}

/* trace */
#trace{background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.trace-grid{display:grid;grid-template-columns:320px 1fr;gap:40px;align-items:start}
@media (max-width:860px){.trace-grid{grid-template-columns:1fr}}
.qr-box{border:1px solid var(--line);border-radius:var(--r);padding:24px;background:var(--sand);text-align:center}
.qr{width:180px;height:180px;margin:14px auto;background:#fff;padding:10px;border-radius:10px;display:grid;place-items:center}
.qr svg{width:100%;height:auto}
.qr-code{font-family:Fraunces,serif;letter-spacing:.12em;font-size:1.1rem}
.lot-input{display:flex;gap:8px;margin-top:18px}
.lot-input input{flex:1;min-width:0;min-height:42px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--card)}
.farm h3{font-size:1.7rem;margin:6px 0 4px}
.farm-facts{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:22px 0}
.farm-facts div{background:var(--card);padding:14px}
.farm-facts small{display:block;color:var(--ink-2);font-size:.75rem;text-transform:uppercase;letter-spacing:.08em}
.farm-facts b{font-weight:500;font-size:.95rem}
@media (max-width:560px){.farm-facts{grid-template-columns:repeat(2,1fr)}}
.journey{display:grid;grid-template-columns:repeat(4,1fr);position:relative;margin-top:8px}
.journey::before{content:"";position:absolute;top:7px;left:12.5%;right:12.5%;height:1px;background:var(--terra);opacity:.5}
.journey div{text-align:center;font-size:.82rem;color:var(--ink-2);position:relative}
.journey div::before{content:"";display:block;width:15px;height:15px;border-radius:50%;background:var(--card);border:2px solid var(--terra);margin:0 auto 8px}
.journey div:last-child::before{background:var(--terra)}
.journey b{display:block;color:var(--ink);font-weight:500}

/* growers */
.g-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:28px}
.g-stats div{background:var(--sand);padding:20px}
.g-stats b{display:block;font-family:Fraunces,serif;font-size:1.8rem;font-weight:600}
.g-stats small{color:var(--ink-2);font-size:.85rem}
.growers{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.grower{border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:26px;display:flex;flex-direction:column;gap:10px}
.grower-top{display:flex;justify-content:space-between;align-items:start;gap:12px}
.grower h3{font-size:1.3rem}
.grower .reg{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--leaf);font-weight:600;white-space:nowrap;padding-top:6px}
.grower p{color:var(--ink-2);font-size:.95rem}
.g-facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.g-facts span{font-size:.82rem;border:1px solid var(--line);border-radius:999px;padding:4px 12px;background:var(--sand)}
.grower .impact{font-size:.9rem;border-left:2px solid var(--terra);padding-left:12px;color:var(--ink)}
.grower .btn{align-self:flex-start;margin-top:6px}
@media (max-width:760px){.growers{grid-template-columns:1fr}.g-stats{grid-template-columns:repeat(2,1fr)}}

/* loyalty */
#loyalty{background:var(--ink);color:var(--sand)}
#loyalty .eyebrow{color:#e0a07f}
#loyalty .muted{color:#c9b9a6}
.loy-grid{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:start}
@media (max-width:860px){.loy-grid{grid-template-columns:1fr}}
.tiers{margin-top:28px;display:grid;gap:12px}
.tier{display:grid;grid-template-columns:110px 1fr;gap:16px;padding:16px 0;border-top:1px solid rgba(245,238,227,.15);font-size:.94rem}
.tier strong{font-family:Fraunces,serif;font-size:1.1rem;font-weight:600}
.tier span{color:#c9b9a6}
.lcard{background:var(--sand);color:var(--ink);border-radius:20px;padding:28px;box-shadow:0 30px 60px -30px rgba(0,0,0,.5)}
.lcard h3{font-size:1.4rem}
.lcard .muted{color:var(--ink-2)!important}
.field{display:grid;gap:6px;margin-bottom:14px}
.field label,.field .lbl{font-size:.84rem;font-weight:500;color:var(--ink-2)}
.field input,.field select{min-height:46px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:0 14px;width:100%}
.member-top{display:flex;justify-content:space-between;align-items:start;gap:16px;margin-bottom:22px}
.tier-pill{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;font-weight:600;background:var(--leaf);color:#fff;border-radius:999px;padding:5px 12px;white-space:nowrap}
.stamps{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin:10px 0 8px}
.stamp{aspect-ratio:1;border-radius:50%;border:1.5px dashed var(--line);display:grid;place-items:center}
.stamp.on{border:none;background:var(--terra)}
.stamp.on svg{width:55%;height:55%}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.stat b{display:block;font-family:Fraunces,serif;font-size:1.3rem}
.stat small{color:var(--ink-2);font-size:.78rem}
.note{font-size:.8rem;color:var(--ink-2);margin-top:14px}
.row{display:flex;gap:10px;flex-wrap:wrap}

/* bestie */
.bestie-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
@media (max-width:860px){.bestie-grid{grid-template-columns:1fr}}
.perk{padding:28px;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
.perk h3{font-size:1.25rem;margin-bottom:6px}
.perk p{color:var(--ink-2);font-size:.95rem}
.perk ul{margin-top:14px;padding-left:18px;color:var(--ink-2);font-size:.94rem;display:grid;gap:6px}
.code{margin-top:18px;padding:18px;border:1.5px dashed var(--terra);border-radius:12px;text-align:center}
.code b{font-family:Fraunces,serif;font-size:1.8rem;letter-spacing:.12em;display:block}

/* visit */
.visit-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
@media (max-width:760px){.visit-grid{grid-template-columns:1fr}}
.visit-grid h3{font-size:1.1rem;margin-bottom:8px}
.visit-grid p,.visit-grid li{color:var(--ink-2);font-size:.95rem}
.visit-grid ul{list-style:none;display:grid;gap:4px}
.visit-grid li{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:6px 0}

footer{border-top:1px solid var(--line);padding:32px 0;font-size:.86rem;color:var(--ink-2)}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

/* drawer + modal */
.scrim{position:fixed;inset:0;background:rgba(42,29,21,.4);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(440px,100%);background:var(--sand);z-index:50;transform:translateX(100%);transition:transform .3s ease;display:flex;flex-direction:column}
.drawer.open{transform:none}
.dr-head{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid var(--line)}
.dr-head h2{font-size:1.4rem}
.x{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:1.1rem}
.dr-body{flex:1;overflow:auto;padding:20px 24px}
.dr-foot{padding:18px 24px;border-top:1px solid var(--line);background:var(--card)}
.dr-foot:empty{display:none}
.line{display:grid;grid-template-columns:1fr auto;gap:8px;padding:14px 0;border-bottom:1px solid var(--line)}
.line .nm{font-weight:500}
.line .sub{font-size:.85rem;color:var(--ink-2)}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--card);cursor:pointer}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:14px}
.seg.two{grid-template-columns:1fr 1fr}
.seg button{min-height:42px;border:none;background:var(--card);cursor:pointer;font-size:.9rem;padding:0 6px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sand)}
.tot{display:flex;justify-content:space-between;font-size:.95rem;margin-bottom:6px}
.tot.big{font-weight:600;font-size:1.1rem;margin:8px 0 14px}
.earn,.when-hint{font-size:.85rem;color:var(--leaf);font-weight:500;margin-bottom:14px}
.when-hint{margin-top:-6px}
.empty{text-align:center;padding:40px 0;color:var(--ink-2)}
.done{text-align:center;padding:12px 0}
.done h3{font-size:1.5rem;margin:12px 0 8px}
.done pre{white-space:pre-wrap;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;font-family:inherit;font-size:.85rem;margin:16px 0;color:var(--ink-2)}
.usual-mini{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:14px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.usual-mini small{display:block;color:var(--ink-2);font-size:.82rem}

.modal{position:fixed;left:50%;top:50%;width:min(520px,calc(100% - 32px));max-height:calc(100% - 48px);overflow:auto;background:var(--sand);border-radius:20px;z-index:55;transform:translate(-50%,-46%);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.modal.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.m-head{padding:24px 24px 0;display:flex;justify-content:space-between;gap:12px;align-items:start}
.m-head h2{font-size:1.6rem}
.m-body{padding:12px 24px 24px}
.m-body p.desc{color:var(--ink-2);margin-bottom:16px}
.origin{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:18px;font-size:.9rem}
.origin b{display:block;font-family:var(--head)}
.opt{margin-bottom:14px}
.opt .lbl{font-size:.84rem;font-weight:500;color:var(--ink-2);margin-bottom:6px;display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:.88rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--sand);border-color:var(--ink)}
.m-foot{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:16px 24px;border-top:1px solid var(--line);background:var(--card);position:sticky;bottom:0}

/* tracker */
.ord{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:18px;margin-bottom:16px}
.ord-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ord-top b{font-family:var(--head);font-size:1.15rem}
.ord-top span{font-size:.82rem;color:var(--ink-2)}
.ord .eta{font-size:.9rem;color:var(--leaf);font-weight:500;margin:4px 0 14px}
.steps-v{list-style:none;display:grid;gap:0}
.steps-v li{display:grid;grid-template-columns:22px 1fr;gap:12px;position:relative;padding-bottom:16px;font-size:.92rem;color:var(--ink-2)}
.steps-v li:last-child{padding-bottom:0}
.steps-v li::before{content:"";width:14px;height:14px;border-radius:50%;border:2px solid var(--line);background:var(--card);margin-top:4px;z-index:1}
.steps-v li::after{content:"";position:absolute;left:7px;top:18px;bottom:-2px;width:2px;background:var(--line)}
.steps-v li:last-child::after{display:none}
.steps-v li.done-s{color:var(--ink)}
.steps-v li.done-s::before{background:var(--leaf);border-color:var(--leaf)}
.steps-v li.done-s::after{background:var(--leaf)}
.steps-v li.now{color:var(--ink);font-weight:600}
.steps-v li.now::before{background:var(--terra);border-color:var(--terra);box-shadow:0 0 0 4px rgba(168,79,42,.18)}
.ord .items{font-size:.85rem;color:var(--ink-2);margin-top:12px;border-top:1px solid var(--line);padding-top:10px}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:var(--sand);padding:12px 20px;border-radius:999px;font-size:.9rem;opacity:0;transition:opacity .25s,transform .25s;z-index:60;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

}

/* ---------- item details ---------- */
let modalItem=null, sel={};
function optPrice(i,o){ let p=i.p; if(o.milk==="oat"||o.milk==="almond") p+=2000; if(o.temp==="iced") p+=1000; if(o.shot) p+=2000; return p; }
function optLabel(o){
  const a=[]; if(o.milk&&o.milk!=="regular") a.push(t("d."+o.milk)); if(o.temp==="iced") a.push(t("d.iced")); if(o.shot) a.push(t("d.shot")); if(o.sweet==="less") a.push(t("d.less"));
  return a.join(" · ");
}
function openDetails(name, keep){
  const i=findItem(name); if(!i) return;
  if(!keep){ modalItem=i; sel={milk:i.m?"regular":null,temp:i.c?"hot":null,shot:false,sweet:i.s?"normal":null,qty:1}; }
  const L = i.lot && LOTS.find(l=>l.code===i.lot);
  const chips=(key,vals)=>`<div class="chips">${vals.map(([v,lab])=>`<button type="button" class="chip" data-k="${key}" data-v="${v}" aria-pressed="${String(sel[key])===String(v)}">${lab}</button>`).join("")}</div>`;
  $("#modal").innerHTML = `
    <div class="m-head"><div><span class="eyebrow">${t("cat."+i.cat)}${i.tag?" · "+esc(i.tag):""}</span><h2 id="mTitle">${esc(i.n)}</h2></div><button class="x" id="mClose" aria-label="Close">✕</button></div>
    <div class="m-body">
      <p class="desc">${esc(i.d)}</p>
      ${i.inc?`<p class="desc"><b>${t("d.includes")}:</b> ${esc(i.inc)}</p>`:""}
      ${L?`<div class="origin"><div><small class="muted">${t("d.origin")}</small><b>${esc(L.farm)}</b><span class="muted">${esc(L.region)} · ${esc(L.alt)} · ${esc(L.notes)}</span></div><button class="btn sm ghost" data-trace="${L.code}">${t("d.traceIt")}</button></div>`:""}
      ${i.m?`<div class="opt"><span class="lbl">${t("d.milk")}</span>${chips("milk",[["regular",t("d.regular")],["oat",t("d.oat")+" +2,000"],["almond",t("d.almond")+" +2,000"]])}</div>`:""}
      ${i.c?`<div class="opt"><span class="lbl">${t("d.temp")}</span>${chips("temp",[["hot",t("d.hot")],["iced",t("d.iced")+" +1,000"]])}</div>
             <div class="opt"><span class="lbl">${t("d.extras")}</span>${chips("shot",[["true",t("d.shot")+" +2,000"]])}</div>`:""}
      ${i.s?`<div class="opt"><span class="lbl">${t("d.sweet")}</span>${chips("sweet",[["normal",t("d.normal")],["less",t("d.less")]])}</div>`:""}
      <div class="opt"><span class="lbl">${t("d.qty")}</span><div class="qty"><button type="button" data-q="-1" aria-label="-">−</button><span id="mQty">${sel.qty}</span><button type="button" data-q="1" aria-label="+">+</button></div></div>
    </div>
    <div class="m-foot"><b id="mPrice" style="font-size:1.1rem">${fmt(optPrice(i,sel)*sel.qty)}</b><button class="btn" id="mAdd">${t("d.add")}</button></div>`;
  if(!keep){ $("#modal").classList.add("open"); $("#scrim").classList.add("open"); $("#mClose").focus(); }
}
function closeDetails(){ $("#modal").classList.remove("open"); modalItem=null; if(!$("#drawer").classList.contains("open")) $("#scrim").classList.remove("open"); }
$("#modal").addEventListener("click",e=>{
  if(e.target.id==="mClose") return closeDetails();
  const c=e.target.closest(".chip");
  if(c){ const k=c.dataset.k; if(k==="shot") sel.shot=!sel.shot; else sel[k]=c.dataset.v; if(k==="shot") c.setAttribute("aria-pressed",sel.shot); else c.parentElement.querySelectorAll(".chip").forEach(b=>b.setAttribute("aria-pressed", b.dataset.v===sel[k])); $("#mPrice").textContent=fmt(optPrice(modalItem,sel)*sel.qty); return; }
  const q=e.target.closest("[data-q]");
  if(q){ sel.qty=Math.max(1,sel.qty+ +q.dataset.q); $("#mQty").textContent=sel.qty; $("#mPrice").textContent=fmt(optPrice(modalItem,sel)*sel.qty); return; }
  const tr=e.target.closest("[data-trace]"); if(tr){ const code=tr.dataset.trace; closeDetails(); showLot(code,true); return; }
  if(e.target.id==="mAdd"){ const o={milk:sel.milk,temp:sel.temp,shot:sel.shot,sweet:sel.sweet}; addToCart(modalItem,o,sel.qty); closeDetails(); }
});

function addToCart(i,o,qty){
  const key=lineKey(i.n,o), price=optPrice(i,o||{});
  const l=cart.find(x=>x.key===key);
  l ? l.qty+=qty : cart.push({key,name:i.n,opts:o||{},price,qty});
  saveCart(); updateBadges(); if(view!=="track") view="cart"; if($("#drawer").classList.contains("open")) renderDrawer();
  toast(t("t.added",{x:i.n}));
}
const total=()=>cart.reduce((s,l)=>s+l.price*l.qty,0);
const count=()=>cart.reduce((s,l)=>s+l.qty,0);
function keepForm(){ ["oName","oPhone","oAddr","oNote"].forEach(id=>{ const el=document.getElementById(id); if(el) draft[id]=el.value; }); const tm=$("#oTime"); if(tm) whenTime=tm.value; }
function timeOptions(){
  const now=new Date(), g={};
  const names={Morning:"☀",Afternoon:"◑",Evening:"☾",Late:"✦"};
  for(let m=5*60+30;m<=23*60+45;m+=15){
    if(whenDay===0 && m < now.getHours()*60+now.getMinutes()+20) continue;
    const tt=String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
    const k=m<12*60?"Morning":m<17*60?"Afternoon":m<21*60?"Evening":"Late";
    (g[k]=g[k]||[]).push(`<option ${tt===whenTime?"selected":""}>${tt}</option>`);
  }
  const h=Object.entries(g).map(([k,o])=>`<optgroup label="${names[k]}">${o.join("")}</optgroup>`).join("");
  return h || `<option disabled selected>${t("cart.noslots")}</option>`;
}
function whenInfo(){
  const now=Date.now();
  if(whenMode==="asap") return {label:t("cart.asap"), due:now+12*60000};
  const s=$("#oTime"); const opt=s && s.options[s.selectedIndex]; if(!opt||opt.disabled) return null;
  const [h,m]=s.value.split(":").map(Number); const d=new Date(); d.setDate(d.getDate()+whenDay); d.setHours(h,m,0,0);
  return {label:`${whenDay?t("cart.tomorrow"):t("cart.today")} ${s.value}`, due:d.getTime()};
}

/* usual */
function getUsual(){ return store.get("kv_usual"); }
function usualSummary(u){ return u.map(l=>`${l.qty}× ${l.name}${optLabel(l.opts)?" ("+optLabel(l.opts)+")":""}`).join(", "); }
function addUsual(){ const u=getUsual(); if(!u) return; u.forEach(l=>{ const i=findItem(l.name); if(i){ const key=lineKey(i.n,l.opts); const ex=cart.find(x=>x.key===key); ex?ex.qty+=l.qty:cart.push({key,name:i.n,opts:l.opts,price:optPrice(i,l.opts),qty:l.qty}); } }); saveCart(); updateBadges(); toast(t("t.usualAdded")); view="cart"; openDrawer("cart"); }
function renderUsual(){
  const u=getUsual(), bar=$("#usualBar"), m=member();
  $("#usualFromCard").classList.toggle("hidden", !u);
  if(!u){ bar.classList.add("hidden"); return; }
  bar.classList.remove("hidden");
  bar.innerHTML=`<div><b>${t("usual.title")}${m?", "+esc(m.name):""}</b><br><span>${esc(usualSummary(u))}</span></div><button class="btn sm" data-usual>${t("usual.order")}</button>`;
}
document.addEventListener("click",e=>{ if(e.target.closest("[data-usual]")||e.target.id==="usualFromCard") addUsual(); });

/* orders + tracking (demo timing) */
function getOrders(){ return store.get("kv_orders")||[]; }
function saveOrders(o){ store.set("kv_orders",o); }
function stagesFor(o){
  const last = o.mode==="delivery" ? ["tr.otw","tr.delivered"] : o.mode==="dine" ? ["tr.readyTable"] : ["tr.ready"];
  return ["tr.received","tr.confirmed","tr.preparing",...last];
}
function stageIndex(o){
  const now=Date.now(), st=stagesFor(o);
  const prep=Math.max(o.placed+2*60000, o.due-10*60000);
  let i=0;
  if(now>=o.placed+60000) i=1;
  if(now>=prep) i=2;
  if(now>=o.due) i=3;
  if(o.mode==="delivery" && now>=o.due+20*60000) i=4;
  return Math.min(i, st.length-1);
}
const isActive=o=>{ const st=stagesFor(o); return stageIndex(o)<st.length-1 || Date.now()<o.due+45*60000; };
function updateBadges(){
  const n=count(); const cc=$("#cartCount"); cc.textContent=n; cc.dataset.n=n;
  const a=getOrders().filter(isActive).length; const tc=$("#trackCount"); tc.textContent=a; tc.dataset.n=a;
}

function placeOrder(){
  keepForm();
  const name=(draft.oName||"").trim(), phone=(draft.oPhone||"").trim();
  if(!name||!phone){ toast(t("t.needName")); return; }
  if(mode==="delivery" && !(draft.oAddr||"").trim()){ toast(t("t.needAddr")); return; }
  const w=whenInfo(); if(!w){ toast(t("t.needTime")); return; }
  const id="KV"+Math.random().toString(36).slice(2,6).toUpperCase();
  const modeLbl={pickup:"Pickup",dine:"Dine-in",delivery:"Delivery"}[mode];
  const lines=cart.map(l=>`• ${l.qty} × ${l.name}${optLabel(l.opts)?" ("+optLabel(l.opts)+")":""} — ${fmt(l.price*l.qty)}`).join("\n");
  const text=`Habari KIVULI CAFE! New order ${id}\n\n${lines}\n\nTotal: ${fmt(total())}\nType: ${modeLbl}${mode==="delivery"?" to "+draft.oAddr.trim():""}\nWhen: ${w.label}\nName: ${name}\nPhone: ${phone}${(draft.oNote||"").trim()?"\nNote: "+draft.oNote.trim():""}`;
  let stamps=0; const m=member();
  if(m){ stamps=Math.floor(total()/10000); m.points+=stamps; m.visits+=1; saveMember(m); renderMember(); }
  const items=cart.map(l=>({name:l.name,opts:l.opts,qty:l.qty}));
  store.set("kv_usual", items);
  const orders=getOrders(); orders.unshift({id,items,total:total(),mode,when:w.label,due:w.due,placed:Date.now()}); saveOrders(orders.slice(0,10));
  lastOrder={id,text,stamps}; cart=[]; saveCart(); draft={}; whenMode="asap"; whenTime=null;
  view="done"; renderDrawer(); renderUsual(); updateBadges();
}

/* drawer */
function openDrawer(v){ view=v||view; renderDrawer(); $("#drawer").classList.add("open"); $("#drawer").setAttribute("aria-hidden","false"); $("#scrim").classList.add("open"); $("#closeDrawer").focus(); if(view==="track") startTick(); }
function closeDrawer(){ $("#drawer").classList.remove("open"); $("#drawer").setAttribute("aria-hidden","true"); if(!$("#modal").classList.contains("open")) $("#scrim").classList.remove("open"); stopTick(); }
let tick=null; function startTick(){ stopTick(); tick=setInterval(()=>{ if(view==="track") renderDrawer(); updateBadges(); },15000); } function stopTick(){ clearInterval(tick); tick=null; }

function renderDrawer(){
  const body=$("#drBody"), foot=$("#drFoot"), m=member();
  if(view==="track"){
    $("#drTitle").textContent=t("tr.title");
    const orders=getOrders();
    if(!orders.length){ body.innerHTML=`<div class="empty"><p>${t("tr.none")}</p><p style="font-size:.9rem;margin-top:6px">${t("tr.noneHint")}</p></div>`; foot.innerHTML=`<a href="#menu" class="btn" style="width:100%" data-close>${t("cart.browse")}</a>`; return; }
    body.innerHTML = orders.map(o=>{
      const st=stagesFor(o), idx=stageIndex(o), finished=idx===st.length-1;
      const eta = finished ? t("tr.done") : t(o.mode==="delivery"?"tr.etaDel":"tr.eta",{t:hhmm(new Date(o.mode==="delivery"?o.due+20*60000:o.due))});
      return `<div class="ord"><div class="ord-top"><b>${o.id}</b><span>${esc(o.when)} · ${t("cart."+(o.mode==="dine"?"dine":o.mode))}</span></div>
        <p class="eta">${eta}</p>
        <ol class="steps-v">${st.map((k,i)=>`<li class="${i<idx?"done-s":i===idx?"now":""}"><span>${t(k)}</span></li>`).join("")}</ol>
        <div class="items">${esc(usualSummary(o.items))} · ${fmt(o.total)}</div></div>`;
    }).join("") + `<p class="note">${t("tr.demo")}</p>`;
    foot.innerHTML=`<button class="btn ghost" style="width:100%" id="clearDone">${t("tr.clear")}</button>`;
    return;
  }
  $("#drTitle").textContent=t("cart.title");
  if(view==="done" && lastOrder){
    body.innerHTML=`<div class="done"><span class="eyebrow">${lastOrder.id}</span><h3>${t("cart.sendH")}</h3><p class="muted" style="font-size:.92rem">${t("cart.sendP")}</p>
      <pre>${esc(lastOrder.text)}</pre>
      <div class="row" style="justify-content:center"><a class="btn" href="https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(lastOrder.text)}" target="_blank" rel="noopener">${t("cart.wa")}</a><button class="btn ghost" id="copyOrder">${t("cart.copy")}</button></div>
      <p class="note">${lastOrder.stamps?t("cart.added",{n:lastOrder.stamps}):t("cart.joinNext")}</p></div>`;
    foot.innerHTML=`<div class="row"><button class="btn" style="flex:1" id="goTrack">${t("cart.track")}</button><button class="btn ghost" style="flex:1" id="newOrder">${t("cart.new")}</button></div>`;
    return;
  }
  const u=getUsual();
  const usualBox = u ? `<div class="usual-mini"><div><b>${t("usual.title")}</b><small>${esc(usualSummary(u))}</small></div><button class="btn sm ghost" data-usual>${t("usual.add")}</button></div>` : "";
  if(!cart.length){
    body.innerHTML=usualBox+`<div class="empty"><p>${t("cart.empty")}</p><p style="font-size:.9rem;margin-top:6px">${t("cart.emptyHint")}</p></div>`;
    foot.innerHTML=`<a href="#menu" class="btn" style="width:100%" data-close>${t("cart.browse")}</a>`; return;
  }
  body.innerHTML = cart.map((l,i)=>`
    <div class="line"><div><div class="nm">${esc(l.name)}</div><div class="sub">${optLabel(l.opts)?esc(optLabel(l.opts))+" · ":""}${fmt(l.price)}</div></div>
    <div class="qty"><button data-i="${i}" data-d="-1" aria-label="-">−</button><span>${l.qty}</span><button data-i="${i}" data-d="1" aria-label="+">+</button></div></div>`).join("") + `
    <div style="margin-top:22px">
      <div class="seg" role="group">${["pickup","dine","delivery"].map(x=>`<button type="button" data-mode="${x}" aria-pressed="${x===mode}">${t("cart."+x)}</button>`).join("")}</div>
      <div class="field"><span class="lbl">${t("cart.when")}</span>
        <div class="seg two" role="group"><button type="button" data-when="asap" aria-pressed="${whenMode==="asap"}">${t("cart.asap")}</button><button type="button" data-when="later" aria-pressed="${whenMode==="later"}">${t("cart.sched")}</button></div></div>
      ${whenMode==="asap" ? `<p class="when-hint">${t(mode==="delivery"?"cart.readyDel":"cart.ready")}</p>` : `
        <div class="seg two" role="group"><button type="button" data-day="0" aria-pressed="${whenDay===0}">${t("cart.today")}</button><button type="button" data-day="1" aria-pressed="${whenDay===1}">${t("cart.tomorrow")}</button></div>
        <div class="field"><label for="oTime">${t("cart.time")}</label><select id="oTime">${timeOptions()}</select></div>
        <p class="when-hint">${t("cart.open")}</p>`}
      <div class="field"><label for="oName">${t("f.name")}</label><input id="oName" value="${esc(draft.oName ?? (m?m.name:""))}"></div>
      <div class="field"><label for="oPhone">${t("f.phone")}</label><input id="oPhone" inputmode="tel" value="${esc(draft.oPhone ?? (m?m.phone:""))}" placeholder="07XX XXX XXX"></div>
      ${mode==="delivery"?`<div class="field"><label for="oAddr">${t("f.addr")}</label><input id="oAddr" value="${esc(draft.oAddr ?? "")}"></div>`:""}
      <div class="field"><label for="oNote">${t("f.note")}</label><input id="oNote" value="${esc(draft.oNote ?? "")}"></div>
    </div>`;
  const st=Math.floor(total()/10000);
  foot.innerHTML=`<div class="tot"><span>${t("cart.items",{n:count()})}</span><span>${fmt(total())}</span></div>
    <div class="tot big"><span>${t("cart.total")}</span><span>${fmt(total())}</span></div>
    <div class="earn">${m?t("cart.earn",{n:st}):t("cart.joinEarn",{n:st})}</div>
    <button class="btn" id="placeOrder" style="width:100%">${t("cart.place")}</button>`;
}
$("#drBody").addEventListener("change",e=>{ if(e.target.id==="oTime") whenTime=e.target.value; });
$("#drBody").addEventListener("click",e=>{
  const q=e.target.closest(".qty button"); if(q){ const l=cart[+q.dataset.i]; l.qty+= +q.dataset.d; if(l.qty<=0) cart.splice(+q.dataset.i,1); saveCart(); updateBadges(); keepForm(); renderDrawer(); return; }
  const md=e.target.closest("[data-mode]"); if(md){ keepForm(); mode=md.dataset.mode; renderDrawer(); return; }
  const w=e.target.closest("[data-when]"); if(w){ keepForm(); whenMode=w.dataset.when; renderDrawer(); return; }
  const dy=e.target.closest("[data-day]"); if(dy){ keepForm(); whenDay=+dy.dataset.day; whenTime=null; renderDrawer(); return; }
  if(e.target.id==="copyOrder") navigator.clipboard?.writeText(lastOrder.text).then(()=>toast(t("t.copied")),()=>{});
});
$("#drFoot").addEventListener("click",e=>{
  if(e.target.id==="placeOrder") placeOrder();
  if(e.target.id==="newOrder"){ view="cart"; lastOrder=null; renderDrawer(); }
  if(e.target.id==="goTrack"){ view="track"; renderDrawer(); startTick(); }
  if(e.target.id==="clearDone"){ saveOrders(getOrders().filter(isActive)); renderDrawer(); updateBadges(); }
  if(e.target.closest("[data-close]")) closeDrawer();
});
$("#drBody").addEventListener("click",e=>{ if(e.target.closest("[data-close]")) closeDrawer(); });
$("#openCart").onclick=()=>openDrawer(view==="track"?"cart":view);
$("#openTrack").onclick=()=>openDrawer("track");
$("#closeDrawer").onclick=closeDrawer;
$("#scrim").onclick=()=>{ closeDetails(); closeDrawer(); };
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ if($("#modal").classList.contains("open")) closeDetails(); else closeDrawer(); } });

/* ---------- loyalty ---------- */
function member(){ return store.get("kv_member"); }
function saveMember(m){ store.set("kv_member", m); }
function tierOf(m){ return m.visits>=40?"Mwenyeji": m.visits>=15?"Rafiki":"Mgeni"; }
const cupSvg=`<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M5 9h11v5a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5z"/><path d="M16 10h2a2 2 0 0 1 0 4h-2"/></svg>`;
function renderMember(){
  const m=member();
  $("#joinForm").classList.toggle("hidden", !!m); $("#member").classList.toggle("hidden", !m);
  if(!m) return;
  const avail=m.points-m.redeemed*10, rewards=Math.floor(avail/10), cur=avail%10;
  $("#mName").textContent=m.name; $("#mPhone").textContent=m.phone; $("#mTier").textContent=tierOf(m);
  $("#mStampTxt").textContent=`${cur} / 10`;
  $("#stamps").innerHTML=Array.from({length:10},(_,i)=>`<span class="stamp ${i<cur?"on":""}">${i<cur?cupSvg:""}</span>`).join("");
  $("#mPoints").textContent=m.points; $("#mVisits").textContent=m.visits; $("#mRewards").textContent=rewards;
  const nt=m.visits<15?t("loy.toRafiki",{n:15-m.visits}):m.visits<40?t("loy.toMw",{n:40-m.visits}):t("loy.top");
  $("#mNext").textContent=t("loy.toFree",{n:10-cur})+" "+nt;
  $("#redeemBtn").disabled=rewards<1;
  renderUsual();
}
$("#joinForm").addEventListener("submit",e=>{ e.preventDefault(); const name=$("#jName").value.trim(), phone=$("#jPhone").value.trim(); if(!name||!phone) return; const ex=member(); saveMember(ex&&ex.phone===phone?ex:{name,phone,points:0,visits:0,redeemed:0}); renderMember(); toast(t("t.welcome",{x:name})); });
$("#signOut").onclick=()=>{ store.del("kv_member"); $("#redeemCode").classList.add("hidden"); renderMember(); renderUsual(); };
$("#redeemBtn").onclick=()=>{ const m=member(); if(!m) return; m.redeemed++; saveMember(m); renderMember(); $("#redeemVal").textContent="FREE-"+Math.random().toString(36).slice(2,6).toUpperCase(); $("#redeemCode").classList.remove("hidden"); toast(t("t.enjoy")); };

/* ---------- bestie ---------- */
$("#bestieForm").addEventListener("submit",e=>{
  e.preventDefault(); const f=$("#bName").value.trim(); if(!f) return; const m=member();
  $("#bestieVal").textContent="BESTIE-"+((m?m.name:"KV").slice(0,3)+f.slice(0,3)).toUpperCase()+Math.floor(Math.random()*90+10);
  $("#bestieFor").textContent=t("bf.for",{a:m?m.name:"KIVULI",b:f}); $("#bestieCode").classList.remove("hidden");
  if(!m) toast(t("t.joinTip"));
});

/* ---------- trace ---------- */
let activeLot=LOTS[0].code;
const lotHash=c=>"lot-"+c.toLowerCase();
function renderTrace(){
  const L=LOTS.find(l=>l.code===activeLot);
  $("#lotTabs").innerHTML=LOTS.map(l=>`<button class="tab" role="tab" aria-selected="${l.code===activeLot}" data-lot="${l.code}">${l.region}</button>`).join("");
  $("#qrCode").textContent=L.code;
  const qr=$("#qr");
  try{ const q=qrcode(0,"M"); q.addData(SITE_URL+"#"+lotHash(L.code)); q.make(); qr.innerHTML=q.createSvgTag({cellSize:4,margin:0,scalable:true}); }
  catch(e){ qr.innerHTML=`<span class="muted" style="font-size:.8rem">${L.code}</span>`; }
  $("#farm").innerHTML=`
    <span class="eyebrow">${t("trace.lot")} ${L.code} · ${L.region}</span>
    <h3>${L.farm}</h3>
    <p class="muted">${L.place}. ${t("trace.grown")} ${L.grower}.</p>
    <div class="farm-facts">
      <div><small>${t("trace.alt")}</small><b>${L.alt}</b></div><div><small>${t("trace.var")}</small><b>${L.variety}</b></div><div><small>${t("trace.proc")}</small><b>${L.process}</b></div>
      <div><small>${t("trace.harv")}</small><b>${L.harvest}</b></div><div><small>${t("trace.notes")}</small><b>${L.notes}</b></div><div><small>${t("trace.cup")}</small><b>${L.cups}</b></div>
    </div>
    <div class="journey"><div><b>${t("trace.farm")}</b>${L.harvest}</div><div><b>${t("trace.processed")}</b>${L.station}</div><div><b>${t("trace.roasted")}</b>${L.roast}</div><div><b>${t("trace.yours")}</b>KIVULI CAFE</div></div>`;
}
function showLot(code,scroll){
  const L=LOTS.find(l=>l.code.toLowerCase()===String(code).toLowerCase().trim());
  if(!L){ toast(t("trace.notfound")); return false; }
  activeLot=L.code; renderTrace(); if(scroll) document.getElementById("trace").scrollIntoView({behavior:reduce?"auto":"smooth"}); return true;
}
$("#lotTabs").addEventListener("click",e=>{ const b=e.target.closest("[data-lot]"); if(b) showLot(b.dataset.lot); });
$("#lotForm").addEventListener("submit",e=>{ e.preventDefault(); if(showLot($("#lotIn").value)) $("#lotIn").value=""; });
function fromHash(){ const h=location.hash.slice(1); if(h.startsWith("lot-")) showLot(h.slice(4),true); }
addEventListener("hashchange",fromHash);

/* ---------- growers ---------- */

  $("#growerList").innerHTML=GROWERS.map(g=>`
    <article class="grower"><div class="grower-top"><h3>${g.name}</h3><span class="reg">${g.region}</span></div>

      <p class="impact">${g.impact}</p>
      ${g.lot?`<button class="btn sm ghost" data-trace="${g.lot}">${t("gr.trace")}</button>`:`<span class="muted" style="font-size:.85rem;margin-top:6px">${t("gr.soon")}</span>`}
    </article>`).join("");
}
$("#growerList").addEventListener("click",e=>{ const b=e.target.closest("[data-trace]"); if(b) showLot(b.dataset.trace,true); });

/* ---------- header ---------- */
const hdr=$("header"); addEventListener("scroll",()=>hdr.classList.toggle("scrolled",scrollY>8),{passive:true});

        if (b == -1) throw 'eof';
        return b;

      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;

      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];

              bytes.push(b & 0xff);

          }
